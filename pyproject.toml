[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rjson"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
]

[tool.maturin]
features = ["pyo3/extension-module"]
# `compatibility = "linux"` produced plain `linux_x86_64` wheels, which PyPI
# rejects. Leave it unset so maturin auditwheel-checks and tags the highest
# manylinux policy the binary satisfies; CI builds inside manylinux2014
# containers (maturin-action `manylinux: auto`) for broad glibc coverage.

[dependency-groups]
dev = [
    "maturin>=1.8.6",
    "orjson>=3.9.7",
]
