# Build configuration.
#
# x86_64 targets x86-64-v2 (SSE4.2/SSSE3/POPCNT, every x86_64 CPU since ~2009),
# like orjson's wheels. Do NOT use target-cpu=native: wheels built that way
# crash with SIGILL on older CPUs, and on the benchmark Xeon, BMI2 codegen
# (enabled by native / x86-64-v3) made zmij float formatting ~1.6x slower
# (33ns vs 20ns per float in dumps).
#
# One cfg entry covers every x86_64 target (linux-gnu, linux-musl, darwin,
# windows-msvc/gnu). Setting RUSTFLAGS in the environment silently replaces
# these flags; pass extra flags via CARGO_TARGET_<TRIPLE>_RUSTFLAGS, which
# cargo merges with them (scripts/build_pgo.sh does this).

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v2"]
