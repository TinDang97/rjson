[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rjson"
version = "0.1.0"
description = "Fast JSON for Python, written in Rust against the CPython C API"
readme = "README.md"
# CI-tested on CPython 3.9-3.14 (x86_64, aarch64, macOS, Windows). 3.8 also
# builds and passes but is EOL and not tested. 3.14 verified on 3.14.0rc2 (PyO3 0.29).
# PyPy/GraalPy/free-threaded: unsupported.
requires-python = ">=3.9"
dependencies = [
]

[tool.maturin]
features = ["pyo3/extension-module"]
# `compatibility = "linux"` produced plain `linux_x86_64` wheels, which PyPI
# rejects. Leave it unset so maturin auditwheel-checks and tags the highest
# manylinux policy the binary satisfies. Release wheels (.github/workflows/
# wheels.yml) link against glibc 2.17 with `--zig --compatibility manylinux2014`.

[dependency-groups]
dev = [
    "maturin>=1.8.6",
    "orjson>=3.9.7",
]
