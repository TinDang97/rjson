name: Wheels

# PGO release wheels (scripts/build_pgo.sh: instrument -> train on
# scripts/pgo_train.py -> rebuild), one profile per interpreter and platform.
#
# x86_64 wheels target x86-64-v2 via .cargo/config.toml. Never set RUSTFLAGS
# here: it would replace those config rustflags (build_pgo.sh refuses to run
# with RUSTFLAGS set and passes its own flags via CARGO_TARGET_<TRIPLE>_RUSTFLAGS).
#
# Releasing: push a tag vX.Y.Z matching the version in Cargo.toml and
# pyproject.toml. After every wheel and the sdist are built and tested, the
# `publish` job attests their build provenance and uploads them to PyPI with
# trusted publishing (OIDC; no API token is stored anywhere). One-time setup
# on PyPI: add a trusted publisher for project `pyrjson`, owner TinDang97,
# repository rjson, workflow wheels.yml, environment `pypi`; and create the
# `pypi` environment here (Settings -> Environments), ideally with required
# reviewers so a release waits for a human. workflow_dispatch builds the same
# artifacts without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MATURIN_VERSION: "1.15.0"

jobs:
  manylinux:
    name: manylinux ${{ matrix.arch }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # requires-python >=3.10; PyO3 0.29 supports up to 3.14 (3.14 str access: src/compat.rs).
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: llvm-tools
      # Build and train natively on the runner; the optimized build links
      # through zig against glibc 2.17 so the wheel is manylinux2014.
      - run: python -m pip install "maturin[zig]==${MATURIN_VERSION}" pytest
      - name: PGO build
        run: scripts/build_pgo.sh python
        env:
          OUT_DIR: dist
          MATURIN_FINAL_ARGS: --zig --compatibility manylinux2014
      - name: Test
        run: |
          python -m pip install --no-index --find-links dist pyrjson
          python -m pytest tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-manylinux-${{ matrix.arch }}-py${{ matrix.python }}
          path: dist/*.whl

  musllinux:
    name: musllinux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Train inside the musllinux image so the profile comes from a musl
      # interpreter; all CPython versions are built in one container.
      - name: PGO build + test in quay.io/pypa/musllinux_1_2_${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD":/io -w /io \
            -e MATURIN_VERSION -e CARGO_TERM_COLOR \
            quay.io/pypa/musllinux_1_2_${{ matrix.arch }} \
            scripts/ci_build_pgo_container.sh 3.10 3.11 3.12 3.13 3.14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.arch }}
          path: dist/*.whl

  macos:
    name: macos ${{ matrix.arch }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            os: macos-14
          - arch: x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: llvm-tools
      - run: python -m pip install "maturin==${MATURIN_VERSION}" pytest
      - name: PGO build
        run: scripts/build_pgo.sh python
        env:
          OUT_DIR: dist
      - name: Test
        run: |
          python -m pip install --no-index --find-links dist pyrjson
          python -m pytest tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.arch }}-py${{ matrix.python }}
          path: dist/*.whl

  windows:
    name: windows x86_64 py${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: llvm-tools
      - run: python -m pip install "maturin==${MATURIN_VERSION}" pytest
      - name: PGO build
        run: scripts/build_pgo.sh python
        env:
          OUT_DIR: dist
      - name: Test
        run: |
          python -m pip install --no-index --find-links dist pyrjson
          python -m pytest tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-x86_64-py${{ matrix.python }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install "maturin==${MATURIN_VERSION}"
      - run: maturin sdist -o dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [manylinux, musllinux, macos, windows, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pyrjson/
    permissions:
      contents: read
      id-token: write      # trusted publishing and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          py_v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "tag=$TAG Cargo.toml=$cargo_v pyproject.toml=$py_v"
          test "$TAG" = "v$cargo_v" && test "$TAG" = "v$py_v"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Check the distribution set
        run: |
          ls -l dist
          test "$(ls dist/*.tar.gz | wc -l)" = 1
          # 5 Pythons x (2 manylinux + 2 macOS + 1 Windows) + 2 musllinux x 5
          test "$(ls dist/*.whl | wc -l)" -ge 35
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
