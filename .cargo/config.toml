# Build configuration.
#
# Do NOT set `-C target-cpu=native` here. It was previously forced for every
# build (including `maturin build`), which on the AVX-512 build host emitted
# ~735 zmm instructions into the wheel -> SIGILL on any CPU without AVX-512
# (all AMD Zen1-3, most client Intel). It also breaks cross-compilation.
#
# Measured on the corpus benchmark (twitter/citm/canada/github + synthetic),
# native vs x86-64 (v1) vs x86-64-v2 vs x86-64-v3 are within noise (+-5%):
# the hot SIMD kernels already use runtime dispatch
# (`is_x86_feature_detected!` + `#[target_feature]` in simd_escape.rs, and
# simd-json's `runtime-detection` feature), and memchr dispatches at runtime.
#
# For local experiments you can still opt in per build:
#   RUSTFLAGS="-C target-cpu=native" maturin develop --release
#
# Release wheels should additionally be built with PGO (scripts/build_pgo.sh):
# measured -9% loads / -7% dumps time on the corpus.
