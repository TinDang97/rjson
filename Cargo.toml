[package]
name = "rjson"
version = "0.1.0"
edition = "2021"

[lib]
name = "rjson"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
itoap = "1.0"        # integer formatting straight into the output buffer (dumps)
zmij = "1.0"         # shortest round-trip float formatting, same output as orjson (dumps)
simdutf8 = "0.1"     # SIMD UTF-8 validation for bytes input to loads
fast-float = "0.2"   # correctly rounded fallback for >19-digit floats in loads

[build-dependencies]
pyo3-build-config = "0.29"

[profile.release]
# No DWARF in shipped artifacts: identical .text (verified), but the .so drops
# from 4.7 MB to 0.58 MB (gzip: 1.41 MB -> 0.29 MB). Use --profile profiling
# (below) when you need symbols for perf/flamegraph.
debug = false
strip = "symbols"    # PyInit_rjson lives in .dynsym and survives stripping
lto = "fat"          # Aggressive link-time optimization.
codegen-units = 1    # Slower compilation but faster code.
panic = "abort"      # Smaller binary, no unwinding overhead.
opt-level = 3        # Maximum optimization.

[profile.release.build-override]
opt-level = 3        # Optimize build scripts too.

# `cargo build --profile profiling` / `maturin develop --profile profiling`
[profile.profiling]
inherits = "release"
debug = true
strip = false
