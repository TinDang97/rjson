[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyrjson"
version = "0.2.0"
description = "Fast JSON for Python: a faster orjson/json alternative written in Rust against the CPython C API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tin Dang", email = "tindang.ht97@gmail.com" }]
keywords = [
    "json", "fast-json", "orjson", "orjson-alternative", "ujson", "rust", "pyo3",
    "serialization", "deserialization", "parser", "serializer", "ndjson", "fastapi",
    "performance", "simd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
# CI-tested on CPython 3.10-3.14 (x86_64, aarch64, macOS, Windows); 3.14
# verified on 3.14.0rc2 (PyO3 0.29). PyPy/GraalPy/free-threaded: unsupported.
requires-python = ">=3.10"
dependencies = [
]

[project.scripts]
# A faster `python -m json.tool` (also `python -m rjson`).
rjson = "rjson.tool:run"

[project.urls]
Homepage = "https://github.com/TinDang97/rjson"
Documentation = "https://github.com/TinDang97/rjson#usage"
Benchmarks = "https://github.com/TinDang97/rjson/blob/main/docs/SHOWCASE.md"
Changelog = "https://github.com/TinDang97/rjson/blob/main/CHANGELOG.md"
Repository = "https://github.com/TinDang97/rjson"
Issues = "https://github.com/TinDang97/rjson/issues"

[tool.maturin]
# PyPI distribution is "pyrjson" (the name "rjson" is taken by an unrelated
# project); the import name stays `rjson`, taken from the cdylib name in
# Cargo.toml ([lib] name).
features = ["pyo3/extension-module"]
# Mixed layout: python/rjson/ (package __init__, the CLI in tool.py, type
# stubs) around the extension, installed as rjson/rjson.*.so.
python-source = "python"
module-name = "rjson.rjson"
# `compatibility = "linux"` produced plain `linux_x86_64` wheels, which PyPI
# rejects. Leave it unset so maturin auditwheel-checks and tags the highest
# manylinux policy the binary satisfies. Release wheels (.github/workflows/
# wheels.yml) link against glibc 2.17 with `--zig --compatibility manylinux2014`.

[dependency-groups]
dev = [
    "maturin>=1.8.6",
    "orjson>=3.9.7",
]
